# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# ============================================================
# quartz.config.yaml — ANN's Knowledge Garden 설정
# ============================================================
# 수정이 필요한 항목:
#   - pageTitle: 사이트 이름
#   - baseUrl: GitHub Pages 또는 커스텀 도메인
#   - footer 링크: 본인 GitHub, SNS 등으로 교체
# ============================================================

configuration:
  pageTitle: "🧠 ANN's Knowledge Garden"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ko-KR
  # ⚠️ 배포 후 실제 URL
  baseUrl: studyuann.github.io/pofol-lab
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "journal/**"      # 일지는 항상 비공개
    - "projects/**"     # 프로젝트는 기본 비공개 (공개할 것만 is_public: true)
    - "inbox/**"        # inbox는 절대 공개 안 함
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Noto Sans KR        # 한국어 최적화 폰트 (Google Fonts 지원)
      body: Noto Sans KR          # 한국어 본문
      code: JetBrains Mono        # 코드 블록
    colors:
      lightMode:
        light: "#fafaf9"
        lightgray: "#e8e5e0"
        gray: "#b0aba2"
        darkgray: "#3d3832"
        dark: "#1a1714"
        secondary: "#5c7a9e"
        tertiary: "#7eab8b"
        highlight: rgba(92, 122, 158, 0.12)
        textHighlight: "#fde68a88"
      darkMode:
        light: "#13111a"
        lightgray: "#2a2733"
        gray: "#6b6480"
        darkgray: "#c9c4d4"
        dark: "#ebe8f0"
        secondary: "#9b8ec4"
        tertiary: "#7eab8b"
        highlight: rgba(155, 142, 196, 0.15)
        textHighlight: "#7c3aed44"

plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  # ✅ draft: true 노트 자동 제외 (핵심!)
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/studyuann
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
